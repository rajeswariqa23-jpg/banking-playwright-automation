name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Generate BDD tests
        run: npx bddgen

      - name: Start ParaBank container
        run: |
          docker pull parasoft/parabank
          docker run -d --name parabank-local -p 8080:8080 parasoft/parabank

      - name: Wait for ParaBank
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8080/parabank/index.htm; then
              echo "ParaBank is ready"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Run Playwright smoke tests
        run: npx playwright test --grep "@smoke" --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7